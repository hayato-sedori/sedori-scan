<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<link rel="manifest" href="manifest.json">
<title>せどりSCAN MVP</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f6fa;color:#111827;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}
.app{max-width:430px;margin:auto;min-height:100vh;padding-bottom:90px}.head{padding:18px 16px;display:flex;justify-content:space-between;font-weight:900;font-size:21px}
.card{background:#fff;margin:10px 14px;padding:17px;border-radius:20px;box-shadow:0 4px 18px #0000000a}.hero{background:#111827;color:#fff;text-align:center}.camera{width:100%;border-radius:16px;background:#000;min-height:280px;object-fit:cover}.frame{position:absolute;border:3px solid white;width:260px;height:150px;border-radius:18px;left:50%;top:50%;transform:translate(-50%,-50%)}.camwrap{position:relative}
button{width:100%;border:0;border-radius:14px;padding:14px;margin-top:10px;background:#4f46e5;color:white;font-size:16px;font-weight:800}button.secondary{background:#eef2ff;color:#4338ca}
input{width:100%;padding:13px;border:1px solid #dbe1ea;border-radius:12px;font-size:16px}.muted{font-size:11px;color:#6b7280}.title{font-weight:850;margin-bottom:10px}.product{display:flex;gap:12px;align-items:center}.emoji{width:64px;height:64px;border-radius:14px;background:#fff7ed;display:grid;place-items:center;font-size:30px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metric{background:#f8fafc;padding:12px;border-radius:13px}.k{font-size:11px;color:#6b7280}.v{font-size:20px;font-weight:900;margin-top:4px}.status{display:inline-block;padding:7px 11px;border-radius:999px;background:#dcfce7;color:#166534;font-weight:850;font-size:12px}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(430px,100%);background:#fff;border-top:1px solid #e5e7eb;display:flex;height:70px}.nav button{margin:0;background:white;color:#6b7280;border-radius:0;font-size:11px}.nav button.active{color:#4f46e5}
#result{display:none}.notice{padding:12px;background:#fffbeb;border:1px solid #fde68a;border-radius:13px;font-size:12px;line-height:1.5}
</style>
</head>
<body>
<div class="app">
<div class="head"><span>📦 せどりSCAN</span><span>🔔</span></div>

<section id="scan">
<div class="card hero">
<h2>商品をスキャン</h2>
<p style="font-size:12px;color:#cbd5e1">JANを読み取って商品情報を取得します</p>
<div class="camwrap"><video id="video" class="camera" playsinline muted></video><div class="frame"></div></div>
<button id="start">📷 カメラを起動</button>
</div>
<div class="card">
<div class="title">⌨️ JANを手入力</div>
<input id="jan" inputmode="numeric" placeholder="例：3017624010701">
<button class="secondary" id="searchBtn">商品を検索</button>
</div>
</section>

<section id="result">
<div class="card">
<div class="product"><div class="emoji">📦</div><div><div id="name" style="font-weight:850">検索中…</div><div id="brand" class="muted"></div><div id="code" class="muted"></div></div></div>
</div>
<div class="card">
<div class="title">💰 利益計算</div>
<div class="grid">
<div class="metric"><div class="k">販売価格</div><div class="v">¥1,080</div></div>
<div class="metric"><div class="k">仕入れ価格</div><div class="v">¥438</div></div>
<div class="metric"><div class="k">手数料</div><div class="v">¥98</div></div>
<div class="metric"><div class="k">送料</div><div class="v">¥210</div></div>
</div>
<div style="margin-top:12px;background:#111827;color:#fff;padding:15px;border-radius:15px"><div class="muted" style="color:#cbd5e1">見込み利益</div><div style="font-size:32px;font-weight:900">¥334</div><div style="font-size:12px">利益率 30.9% / ROI 76.3%</div></div>
</div>
<div class="card">
<div class="status">🟢 仕入れおすすめ</div>
<div style="font-size:28px;font-weight:900;margin-top:7px">87点</div>
<div class="muted">AI仕入れスコア（MVPデモ）</div>
</div>
<div class="card">
<div class="title">🏪 店舗価格</div>
<div style="display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid #eee"><b>店舗A</b><b>¥398</b></div>
<div style="display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid #eee"><b>店舗B</b><b>¥448</b></div>
<div style="display:flex;justify-content:space-between;padding:11px 0"><b>店舗C</b><b>¥498</b></div>
</div>
<div class="card"><div class="notice">🔔 条件を満たした商品をおすすめアラートとして通知する機能は次の実装段階で接続します。</div></div>
</section>

<div class="nav"><button class="active" onclick="showScan()">📷<br>スキャン</button><button onclick="showResult()">📊<br>結果</button></div>
</div>
<script>
const API_BASE = "https://api.upcitemdb.com/prod/trial/lookup";
const CACHE_PREFIX = "sedoriScanProduct:";
const MIN_LOOKUP_INTERVAL_MS = 10500;
let stream=null,last="",lastLookupAt=0,lookupInProgress=false;
const video=document.getElementById("video"), jan=document.getElementById("jan"), result=document.getElementById("result");
function showScan(){document.getElementById("scan").style.display="block";result.style.display="none"}
function showResult(){if(last)result.style.display="block";document.getElementById("scan").style.display=last?"none":"block"}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function normalizeJan(s){return String(s||"").replace(/\D/g,"")}
function validJan(s){return /^(?:\d{8}|\d{12}|\d{13}|\d{14})$/.test(s)}
function key(c){return CACHE_PREFIX+c}
function loadCache(c){try{const x=JSON.parse(localStorage.getItem(key(c))||'null');return x?.item||null}catch(e){return null}}
function saveCache(c,item){try{localStorage.setItem(key(c),JSON.stringify({savedAt:Date.now(),item}))}catch(e){}}
function toast(t){const x=document.createElement('div');x.textContent=t;Object.assign(x.style,{position:'fixed',left:'50%',bottom:'86px',transform:'translateX(-50%)',background:'#111827',color:'#fff',padding:'11px 15px',borderRadius:'999px',zIndex:99,fontSize:'13px',fontWeight:800,maxWidth:'90%',textAlign:'center'});document.body.appendChild(x);setTimeout(()=>x.remove(),2200)}
const wait=ms=>new Promise(r=>setTimeout(r,ms));
async function fetchTimeout(url,timeout=12000){const c=new AbortController(),t=setTimeout(()=>c.abort(),timeout);try{return await fetch(url,{headers:{Accept:'application/json'},signal:c.signal})}finally{clearTimeout(t)}}
async function search(code){
 code=normalizeJan(code);if(!validJan(code)){toast('JANは8・12・13・14桁で入力してください');return}
 if(lookupInProgress){toast('いま商品検索中です。少し待ってください');return}
 last=code;jan.value=code;document.getElementById('scan').style.display='none';result.style.display='block';
 result.innerHTML='<div class="card"><div class="title">🔎 商品情報</div><div class="notice">商品データを検索しています…<br>JAN：'+esc(code)+'</div></div>'+result.innerHTML;
 result.scrollIntoView({behavior:'smooth'});
 const cached=loadCache(code);if(cached){renderProduct(cached,code,true);toast('保存済みの商品データを表示しました');return}
 const waitMs=Math.max(0,MIN_LOOKUP_INTERVAL_MS-(Date.now()-lastLookupAt));
 if(waitMs){toast('API連続アクセスを避けるため少し待ちます');await wait(waitMs)}
 lastLookupAt=Date.now();lookupInProgress=true;
 try{
   const url=API_BASE+'?upc='+encodeURIComponent(code);let r=await fetchTimeout(url);
   if(r.status===429){
     let sec=parseInt(r.headers.get('Retry-After')||'10',10);if(!Number.isFinite(sec))sec=10;sec=Math.min(Math.max(sec,5),30);
     renderMessage('⏳ APIアクセス制限','約'+sec+'秒後に1回だけ自動再試行します。','JAN：'+code);await wait(sec*1000);lastLookupAt=Date.now();r=await fetchTimeout(url)
   }
   const ct=r.headers.get('content-type')||'';if(!ct.includes('application/json'))throw new Error('NON_JSON');
   const d=await r.json();
   if(r.ok&&Array.isArray(d.items)&&d.items.length){saveCache(code,d.items[0]);renderProduct(d.items[0],code,false)}
   else if(r.status===404||d.code==='NOT_FOUND')renderNotFound(code);
   else if(r.status===429||['EXCEED_LIMIT','TOO_FAST'].includes(d.code))renderMessage('⚠️ APIアクセス制限','少し時間を空けてから再検索してください。','JAN：'+code);
   else renderMessage('⚠️ 商品APIエラー','API側で一時的なエラーが発生しました。','JAN：'+code+' / HTTP '+r.status+' / '+(d.code||'UNKNOWN'))
 }catch(e){renderMessage('⚠️ 商品検索に接続できませんでした',e.name==='AbortError'?'通信がタイムアウトしました。':'通信またはブラウザ側の接続に失敗しました。','JAN：'+code+'（JANの読み取り自体は成功）')}
 finally{lookupInProgress=false}
}
function renderProduct(item,code,cached){
 const title=item.title||'商品名未登録',brand=item.brand||'—',cat=item.category||'—',img=item.images?.[0]||'',ean=item.ean||item.gtin||code;
 document.getElementById('name').textContent=title;document.getElementById('brand').textContent=(brand==='—'?cat:brand);document.getElementById('code').textContent='JAN: '+ean;
 if(img){const card=document.querySelector('#result .product');if(card){const old=card.querySelector('.emoji');if(old){const im=document.createElement('img');im.className='productImg';im.src=img;im.alt='';old.replaceWith(im)}}}
 const n=document.querySelector('#result .notice');if(n)n.textContent='カテゴリ：'+cat+(cached?' ／ 端末保存データ':' ／ API取得成功');
}
function renderNotFound(code){renderMessage('✓ JANは正常に読み取れました','商品データベースに登録がない可能性があります。通信エラーとは限りません。','JAN：'+code)}
function renderMessage(title,msg,sub){document.getElementById('name').textContent=title;document.getElementById('brand').textContent=msg;document.getElementById('code').textContent=sub}
document.getElementById('searchBtn').onclick=()=>search(jan.value);
document.getElementById('start').onclick=async()=>{try{stop();stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});video.srcObject=stream;await video.play();if('BarcodeDetector'in window){const f=await BarcodeDetector.getSupportedFormats(),w=f.filter(x=>['ean_13','ean_8','upc_a','upc_e'].includes(x));if(w.length){const d=new BarcodeDetector({formats:w});const loop=async()=>{if(!stream)return;try{const b=await d.detect(video);if(b.length){const c=b[0].rawValue;stop();search(c);return}}catch(e){}requestAnimationFrame(loop)};loop()}else toast('対応バーコード形式がありません。JANを手入力してください')}else toast('このブラウザでは標準バーコード検出に未対応です。JANを手入力してください')}catch(e){toast('カメラ権限またはHTTPSを確認してください')}};
function stop(){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}}
</script>
</body>
</html>
